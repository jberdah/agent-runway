name: Release

# Publishing is deliberate: it happens when a GitHub release is published, not
# on a tag push or a merge, so the version that goes out is one someone chose.
on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write # npm provenance + Trusted Publishing (OIDC)

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Install
        run: npm ci

      - name: Test
        # prepublishOnly runs these again, but failing here gives a readable
        # job rather than an error buried inside npm publish output.
        run: npm test

      - name: The release tag must match package.json
        # A mismatch publishes a version nobody asked for, and npm will not let
        # it be replaced afterwards.
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg=$(node -p "require('./package.json').version")
          if [ "$tag" != "$pkg" ]; then
            echo "::error::Release tag $GITHUB_REF_NAME does not match package.json version $pkg."
            exit 1
          fi

      - name: Check what would be published
        run: npm run pack:check

      - name: Publish
        # No NODE_AUTH_TOKEN: Trusted Publishing authenticates through OIDC once
        # the package is linked to this repository on npmjs.com. Nothing
        # long-lived is stored in repository secrets.
        run: npm publish --provenance --access public
